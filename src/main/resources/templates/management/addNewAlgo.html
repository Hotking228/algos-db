<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoDB - Edit Algorithm</title>
    <style>
        /* ---------- DARK THEME RESET ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            padding: 0;
            max-width: 1400px;
            margin: 0 auto;
            background: #0a0c10;
            color: #e2e8f0;
        }

        /* ========== MAIN CONTENT STYLES ========== */
        .edit-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem 3rem 2rem;
        }

        .form-card {
            background: #111316;
            border-radius: 24px;
            border: 1px solid #23262e;
            padding: 2rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #f1f5f9;
            border-bottom: 2px solid #2d313a;
            padding-bottom: 0.75rem;
        }

        /* form groups */
        .form-group {
            margin-bottom: 1.75rem;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .form-group input[type="text"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: #1a1d24;
            border: 1px solid #2d313a;
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            font-family: "SF Mono", Monaco, Consolas, monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        /* tags grid */
        .tags-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, auto));
            gap: 12px 20px;
            margin-top: 12px;
            padding: 16px;
            background: #1a1d24;
            border-radius: 16px;
            border: 1px solid #2d313a;
        }

        .tag-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 40px;
            transition: background 0.2s;
        }

        .tag-item:hover {
            background: #2d313a;
        }

        .tag-item input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1.5px solid #3f4552;
            border-radius: 5px;
            background-color: #1a1d24;
            transition: all 0.15s;
            cursor: pointer;
            position: relative;
        }

        .tag-item input[type="checkbox"]:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }

        .tag-item input[type="checkbox"]:checked::after {
            content: "✓";
            font-size: 12px;
            color: white;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .tag-item span {
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        /* select styling */
        select {
            cursor: pointer;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 16px center;
        }

        /* submit button */
        .submit-button {
            background: #3b82f6;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            letter-spacing: 0.3px;
            display: inline-block;
            width: 100%;
            max-width: 200px;
        }

        .submit-button:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px -6px rgba(59, 130, 246, 0.4);
        }

        .submit-button:active {
            transform: translateY(1px);
        }

        /* helper text */
        .helper-text {
            font-size: 0.75rem;
            color: #6c7a91;
            margin-top: 0.25rem;
        }

        /* responsive */
        @media (max-width: 768px) {
            .edit-container {
                padding: 0 1rem 2rem 1rem;
            }

            .form-card {
                padding: 1.5rem;
            }

            .form-title {
                font-size: 1.3rem;
            }

            .tags-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, auto));
                gap: 8px;
            }

            .submit-button {
                width: 100%;
                max-width: none;
            }
        }

        /* scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0c10;
        }

        ::-webkit-scrollbar-thumb {
            background: #2d313a;
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3f4552;
        }
    </style>
</head>
<body>

<!-- header fragment -->
<div th:replace="~{fragments/headers/header.html :: header}"></div>

<!-- main content -->
<div class="edit-container">
    <div class="form-card">
        <div class="form-title">Редактировать алгоритм</div>

        <form action="/management/algo/add" method="post">
            <!-- название -->
            <div class="form-group">
                <label for="name">Название алгоритма</label>
                <input type="text" name="name" id="name" placeholder="Введите название...">
                <div class="helper-text">Укажите понятное название алгоритма</div>
            </div>

            <!-- описание -->
            <div class="form-group">
                <label for="description">Описание алгоритма</label>
                <textarea name="description" id="description" cols="100" rows="20" placeholder="Введите описание алгоритма..."></textarea>
                <div class="helper-text">Поддерживается Markdown и подсветка кода</div>
            </div>

            <!-- теги -->
            <div class="form-group">
                <label>Теги</label>
                <div class="tags-grid">
                    <div th:each="tag : ${tags}" class="tag-item">
                        <input type="checkbox" name="newTags" th:id="'tag_' + ${tag.id}" th:value="${tag.name}"/>
                        <label th:for="'tag_' + ${tag.id}" th:text="${tag.name}" style="cursor: pointer;"></label>
                    </div>
                </div>
                <div class="helper-text">Выберите один или несколько тегов</div>
            </div>

            <!-- сложность -->
            <div class="form-group">
                <label for="newComp">Сложность</label>
                <select name="newComp" id="newComp">
                    <option th:each="comp : ${comps}" th:text="${comp.comp}" th:value="${comp.comp}"></option>
                </select>
                <div class="helper-text">Оцените сложность алгоритма</div>
            </div>

            <!-- кнопка -->
            <button type="submit" class="submit-button">Подтвердить</button>
        </form>
    </div>
</div>

</body>
</html>
