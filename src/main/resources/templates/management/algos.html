<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>

        <style>
            .page-button-container{
                display: flex;
                flex-wrap: wrap;/* Перенос на новую строку */
                gap: 10px;/* Расстояние между объектами */
                max-width: 100%;

                margin: 5px;
                border-radius: 10px;
                background-color: #eaeaea;
                /*height: 120px;*/
                width: 500px;
                padding-left: 20px;
                padding-top: 20px;
                padding-bottom: 20px;
            }

            .page-button{
                border-radius: 5px;
                width: 24px;
                height: 24px;
            }
        </style>
    </head>

    <body>
        <div th:replace="~{fragments/headers/header.html :: header}"></div>
        <form action="/management/algo/add" method="get">
            <button type="submit">Добавить новый алгоритм</button>
        </form>
        <div th:each="algo : ${algos}">
            <a th:href="'/algo/' + ${algo.id}" th:text="${algo.id} + '. ' + ${algo.name}">Algo url</a>
            <form th:action="'/management/algo/edit/' + ${algo.id}" method="get">
                <button type="submit">Редактировать</button>
            </form>
            <form th:action="'/management/algo/del/' + ${algo.id}" method="post">
                <button type="submit">Удалить</button>
            </form>
        </div>

        <div class="page-button-container">
            <div th:each="i : ${#numbers.sequence(0, pageNums, 1)}">
                <form th:action="@{'/management/algo/' + ${i}}"
                      method="post">

                    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                    <button type="submit" th:text="${i + 1}" class="page-button">Номер страницы</button>
                </form>
            </div>
        </div>
    </body>
</html>
