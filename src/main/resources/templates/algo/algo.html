<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Algorithm - AlgoDB</title>

    <!-- Стили Highlight.js -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">

    <!-- Сам скрипт Highlight.js (ОБЯЗАТЕЛЬНО!) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script>
        // Активируем подсветку после загрузки страницы
        document.addEventListener('DOMContentLoaded', () => {
            hljs.highlightAll();
        });
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        pre {
            background: #f6f8fa;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
        }

        code {
            font-family: "SF Mono", Monaco, Consolas, monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
<!-- Используем div вместо span, так как контент может содержать блоки -->
<div th:utext="${content}">Content will appear here</div>
</body>
</html>
