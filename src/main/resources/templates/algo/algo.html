<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm - AlgoDB</title>

    <!-- Стили Highlight.js (dark theme compatible) -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

    <!-- Сам скрипт Highlight.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- MathJax -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <script>
        // Активируем подсветку после загрузки страницы
        document.addEventListener('DOMContentLoaded', () => {
            hljs.highlightAll();
        });
    </script>

    <style>
        /* ---------- DARK THEME RESET ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            padding: 0;
            max-width: 1400px;
            margin: 0 auto;
            background: #0a0c10;
            color: #e2e8f0;
        }

        /* ========== HEADER STYLES (добавлены сюда) ========== */
        .header-container {
            background: #0a0c10;
            border-bottom: 1px solid #23262e;
            padding: 0.75rem 2rem;
            margin-bottom: 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
            background: rgba(10, 12, 16, 0.95);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* auth buttons container */
        .auth-buttons {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        /* unified button style */
        .auth-button {
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid;
            background: transparent;
            font-family: inherit;
            letter-spacing: 0.2px;
        }

        /* logout button (red outline) */
        .logout-button {
            background: rgba(127, 29, 29, 0.15);
            border-color: #7f1a1a;
            color: #fecaca;
        }

        .logout-button:hover {
            background: #7f1a1a;
            border-color: #ef4444;
            transform: translateY(-1px);
            color: white;
            box-shadow: 0 4px 12px rgba(127, 29, 29, 0.3);
        }

        /* login button (blue outline) */
        .login-button {
            background: rgba(37, 99, 235, 0.1);
            border-color: #3b82f6;
            color: #93c5fd;
        }

        .login-button:hover {
            background: #3b82f6;
            border-color: #60a5fa;
            transform: translateY(-1px);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* register button (green outline) */
        .register-button {
            background: rgba(5, 150, 105, 0.1);
            border-color: #059669;
            color: #6ee7b7;
        }

        .register-button:hover {
            background: #059669;
            border-color: #10b981;
            transform: translateY(-1px);
            color: white;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }

        /* active/pressed effect for all buttons */
        .auth-button:active {
            transform: translateY(1px);
        }

        /* focus outline */
        .auth-button:focus-visible {
            outline: 2px solid #60a5fa;
            outline-offset: 2px;
        }

        /* header logo */
        .header-content::before {
            content: "AlgoDB";
            font-weight: 600;
            font-size: 1.1rem;
            color: #e2e8f0;
            margin-right: auto;
            letter-spacing: -0.3px;
        }

        /* ========== MAIN CONTENT STYLES ========== */
        .algorithm-content {
            padding: 0 2rem 3rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* TYPOGRAPHY */
        h1, h2, h3, h4, h5, h6 {
            color: #f1f5f9;
            font-weight: 600;
            line-height: 1.3;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            letter-spacing: -0.01em;
        }

        h1 {
            font-size: 2.2rem;
            border-bottom: 2px solid #2d313a;
            padding-bottom: 0.3em;
            margin-top: 0;
        }

        h2 {
            font-size: 1.7rem;
            border-bottom: 1px solid #23262e;
            padding-bottom: 0.2em;
        }

        h3 {
            font-size: 1.4rem;
        }

        p {
            margin-bottom: 1.2em;
            color: #cbd5e1;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        /* CODE BLOCKS */
        pre {
            background: #111316;
            padding: 18px;
            border-radius: 12px;
            overflow-x: auto;
            margin: 1.5em 0;
            border: 1px solid #23262e;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        code {
            font-family: "SF Mono", Monaco, Consolas, "Courier New", monospace;
            font-size: 13.5px;
            line-height: 1.5;
        }

        /* inline code */
        :not(pre) > code {
            background: #1a1d24;
            color: #fbbf24;
            padding: 0.2em 0.4em;
            border-radius: 6px;
            font-size: 0.9em;
            border: 1px solid #2d313a;
        }

        /* MATHJAX */
        .math {
            font-size: 1.1em;
            color: #e2e8f0;
            overflow-x: auto;
            padding: 0.5em 0;
        }

        mjx-container {
            color: #e2e8f0 !important;
        }

        /* LISTS */
        ul, ol {
            margin: 1em 0;
            padding-left: 2em;
            color: #cbd5e1;
        }

        li {
            margin: 0.3em 0;
        }

        /* TABLES */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5em 0;
            background: #111316;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #23262e;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #23262e;
        }

        th {
            background: #1a1d24;
            color: #f1f5f9;
            font-weight: 600;
        }

        tr:hover {
            background: #181b22;
        }

        /* BLOCKQUOTES */
        blockquote {
            border-left: 4px solid #3b82f6;
            background: #111316;
            padding: 1em 1.5em;
            margin: 1.5em 0;
            border-radius: 8px;
            color: #94a3b8;
            font-style: italic;
        }

        /* HR */
        hr {
            border: none;
            height: 1px;
            background: linear-gradient(to right, #23262e, #2d313a, #23262e);
            margin: 2em 0;
        }

        /* IMAGES */
        img {
            max-width: 100%;
            border-radius: 12px;
            border: 1px solid #23262e;
            margin: 1.5em 0;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0c10;
        }

        ::-webkit-scrollbar-thumb {
            background: #2d313a;
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3f4552;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .algorithm-content {
                padding: 0 1rem 2rem 1rem;
            }

            .header-container {
                padding: 0.75rem 1rem;
            }

            .auth-button {
                padding: 0.4rem 1.2rem;
                font-size: 0.8rem;
            }

            h1 {
                font-size: 1.7rem;
            }

            h2 {
                font-size: 1.4rem;
            }

            pre {
                padding: 12px;
                font-size: 12px;
            }
        }

        /* content first child spacing */
        .algorithm-content > :first-child {
            margin-top: 0;
        }

        /* highlighted text */
        strong, b {
            color: #facc15;
            font-weight: 600;
        }
    </style>
</head>
<body>

<!-- header fragment (стили теперь есть на этой странице) -->
<div th:replace="~{fragments/headers/header.html :: header}"></div>

<!-- main content wrapper -->
<div class="algorithm-content">
    <div th:utext="${content}">Content will appear here</div>
</div>

</body>
</html>
