page:
  size: 10
  num: 0
spring:
  security:
    oauth2:
      client:
        registration:
          yandex:
            client-id: ${YANDEX_CLIENT_ID}
            client-secret: ${YANDEX_CLIENT_SECRET}
            client-name: Yandex
            provider: yandex
            redirect-uri: http://localhost:8081/login/oauth2/code/yandex
            scope:
              - login:info
              - login:email
            authorization-grant-type: authorization_code
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info
            user-name-attribute: default_email
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_NAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5433/algos
    username: 'postgres'
    password: '12345'
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        jdbc:
          batch_size: 100
  application:
    name: algos-db
server:
  port: 8081
  address: 0.0.0.0
  ssl:
    key-store: ${KEY_STORE_PATH}
    #file:/home/hotking/keys/algoKeys.jks
    key-store-password: ${KEY_STORE_PASSWORD}
    key-password: ${KEY_STORE_PASSWORD}